
name: Build Vaibhav's Dream City APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/vaibhav/dreamcity

          HTML_FILE=$(find . -type f -name "index.html" -not -path "./app/*" | head -n 1)

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: index.html nahi mila."
            exit 1
          fi

          cp "$HTML_FILE" app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "VaibhavsDreamCity"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.vaibhav.dreamcity'
              compileSdk 34

              defaultConfig {
                  applicationId "com.vaibhav.dreamcity"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="Vaibhav's Dream City"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/vaibhav/dreamcity/MainActivity.kt <<'EOF'
          package com.vaibhav.dreamcity

          import android.annotation.SuppressLint
          import android.os.Bundle
          import android.view.View
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  webView = WebView(this)
                  setContentView(webView)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                      databaseEnabled = true
                      cacheMode = WebSettings.LOAD_NO_CACHE
                  }

                  webView.webViewClient = WebViewClient()
                  webView.setBackgroundColor(android.graphics.Color.BLACK)

                  webView.loadUrl("file:///android_asset/index.html")

                  hideSystemUI()
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) hideSystemUI()
              }

              private fun hideSystemUI() {
                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
                      View.SYSTEM_UI_FLAG_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
              }
          }
          EOF

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.2

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VaibhavsDreamCity-APK
          path: app/build/outputs/apk/debug/app-debug.apk
